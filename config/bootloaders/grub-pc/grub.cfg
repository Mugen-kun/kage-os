source /boot/grub/config.cfg

menuentry "Kage OS'u baslat" --hotkey=l {
    linux @KERNEL_LIVE@ @APPEND_LIVE@
    initrd @INITRD_LIVE@
}

menuentry "Kalici ev diziniyle baslat" --hotkey=p {
    linux @KERNEL_LIVE@ @APPEND_LIVE@ persistence persistence-label=kage-persistence
    initrd @INITRD_LIVE@
}

menuentry "Sifreli ev diziniyle baslat" --hotkey=e {
    linux @KERNEL_LIVE@ @APPEND_LIVE@ persistence persistence-encryption=lukslabel persistence-media=removable-usb persistence-label=kage-persistence
    initrd @INITRD_LIVE@
}

menuentry "Uyumluluk modu" {
    linux @KERNEL_LIVE@ @LB_BOOTAPPEND_LIVE_FAILSAFE@
    initrd @INITRD_LIVE@
}

submenu 'Araclar...' --hotkey=u {
    source /boot/grub/theme.cfg
    if [ "${grub_platform}" = "efi" ]; then
        menuentry "UEFI ayarlari" --hotkey=f {
            fwsetup
        }
    fi
    if @ENABLE_VERIFY_CHECKSUMS@; then
        menuentry "ISO butunlugunu denetle" --hotkey=v {
            linux @KERNEL_LIVE@ @APPEND_VERIFY_CHECKSUMS@
            initrd @INITRD_LIVE@
        }
    fi
}
